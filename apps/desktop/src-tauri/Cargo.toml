[package]
name = "ai-provider-router"
version = "1.0.0"
description = "AI Provider Router — a local-first desktop app that turns the user's own AI provider accounts into one normalized, key-blind AI layer."
authors = ["Tusher Shikder"]
license = "Apache-2.0"
edition = "2021"
# Two binaries now live in this package (`ai-provider-router` from src/main.rs, and
# `aiproviderd`). Without this, `tauri build` fails with "failed to find main binary" — it picks
# the package's main binary by name and cannot disambiguate on its own. Measured 2026-09-23:
# adding the [[bin]] section alone broke the bundle build; `cargo check`, `cargo test`, clippy
# and `cargo build --bin` all stayed green, so nothing but a real `tauri build` finds this.
default-run = "ai-provider-router"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_provider_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Standalone gateway service — headless mode, dev-book §10. Cargo would discover this from
# `src/bin/` anyway; it is declared so the target name cannot drift from the docs and so a
# reader can see there are two binaries without hunting the filesystem.
# The desktop app's own binary is `src/main.rs`, auto-discovered as `ai-provider-router`.
[[bin]]
name = "aiproviderd"
path = "src/bin/aiproviderd.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` (R1): background mode needs a way back into a windowless app. `image-png`
# lets the tray reuse the bundled icon instead of shipping a second one.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
futures-util = "0.3.34"
thiserror = "2.0.20"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "json"] }
keyring = "2"
axum = "0.8"
async-stream = "0.3"
rand = "0.8"
arboard = "3"
url = "2.5.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# macOS only: App Nap suppression. The worker webview is hidden, and macOS suspends JS in
# hidden/backgrounded processes, which stalls the gateway. Pinned to the versions already in
# Cargo.lock (pulled in transitively by Tauri) so this resolves without a network fetch.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
