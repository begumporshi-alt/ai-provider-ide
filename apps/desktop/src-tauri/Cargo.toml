[package]
name = "ai-provider-router"
version = "0.1.0"
description = "AI Provider Router — a local-first desktop app that turns the user's own AI provider accounts into one normalized, key-blind AI layer."
authors = ["Tusher Shikder"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_provider_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` (R1): background mode needs a way back into a windowless app. `image-png`
# lets the tray reuse the bundled icon instead of shipping a second one.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
futures-util = "0.3.34"
thiserror = "2.0.20"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "json"] }
keyring = "2"
axum = "0.8"
async-stream = "0.3"
rand = "0.8"
arboard = "3"
url = "2.5.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
