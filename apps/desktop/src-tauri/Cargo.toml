[package]
name = "ai-provider-router"
version = "1.0.0"
description = "AI Provider Router — a local-first desktop app that turns the user's own AI provider accounts into one normalized, key-blind AI layer."
authors = ["Tusher Shikder"]
license = "Apache-2.0"
edition = "2021"
# Two binaries now live in this package (`ai-provider-router` from src/main.rs, and
# `aiproviderd`). Without this, `tauri build` fails with "failed to find main binary" — it picks
# the package's main binary by name and cannot disambiguate on its own. Measured 2026-09-23:
# adding the [[bin]] section alone broke the bundle build; `cargo check`, `cargo test`, clippy
# and `cargo build --bin` all stayed green, so nothing but a real `tauri build` finds this.
default-run = "ai-provider-router"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_provider_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Standalone gateway service — headless mode, dev-book §10. Cargo would discover this from
# `src/bin/` anyway; it is declared so the target name cannot drift from the docs and so a
# reader can see there are two binaries without hunting the filesystem.
[[bin]]
name = "aiproviderd"
path = "src/bin/aiproviderd.rs"

# The desktop app's own binary. `required-features` is what makes `cargo build
# --no-default-features` skip it — without it, a feature-less build would still compile
# `src/main.rs`, which calls the Tauri `run()` entry point the feature gates away.
[[bin]]
name = "ai-provider-router"
path = "src/main.rs"
required-features = ["app"]

[features]
# `app` is the desktop application — everything that needs Tauri. The headless service does not:
# `cargo build --bin aiproviderd --no-default-features` compiles **no Tauri at all**, which is
# what lets the Linux CI job stop installing WebKitGTK, and what makes "headless" true of the
# dependency graph rather than only of the source. See dev-book §10 §2.1.1.
default = ["app"]
app = ["dep:tauri", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` (R1): background mode needs a way back into a windowless app. `image-png`
# lets the tray reuse the bundled icon instead of shipping a second one.
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `modelIdPattern` is a JavaScript regular expression, so the port needs an engine rather than a
# hand-rolled subset. Default features are declared deliberately, and the reason is a measurement:
# Cargo unifies features per crate across the whole graph, and `tauri-utils` already depends on
# `regex` with defaults on — so `default-features = false` here would be *inert* today and
# *harmful* tomorrow. Inert because the resolved set is the full default one either way
# (`cargo tree -f "{p} {f}"`: `perf`, `perf-literal`, `aho-corasick`, `unicode` and all of it).
# Harmful because `unicode` must stay ON: with it off, `.` becomes byte-oriented and `^dall-e-.*$`
# stops compiling ("pattern can match invalid UTF-8") — a landmine armed by a future dependency
# change rather than by us. With `unicode` on, `\d`/`\w`/`\s` are Unicode-aware where JavaScript's
# are ASCII; that divergence is measured and pinned by tests in `core/modality.rs`, and it is
# unreachable for the ASCII model ids and the class-free builtin rule that actually exist.
# Adding this dependency costs zero new crates: `regex` is already in the graph via `tauri-utils`.
regex = "1"
# The Tier-2 sandbox is a JavaScript module the Generator emits, so the port needs a JS engine and
# not a subset. `rquickjs` binds the same QuickJS C engine that
# `@jitl/quickjs-singlefile-mjs-release-eval` compiles to WASM, so the language semantics are
# identical by construction. **Version 0.9.0 is deliberate, not stale.** Every claim in
# `docs/dev-book/10-headless-service.md` §2.1.3 was measured against 0.9.0 and cites its source
# file:line — `context/base.rs:109` (the global lock `Context::with` holds), `runtime/base.rs:162,170`
# (the two `Runtime` job-queue methods that deadlock under `parallel`), `ctx.rs:375`
# (`Ctx::execute_pending_job`, the only usable pump), `runtime/base.rs:187-197` and
# `context/base.rs:144-149` (where `Send`/`Sync` come from). Cargo reports a 0.14.0 available;
# taking it would void all five measurements at once and re-running them is its own increment.
#
# **`parallel` is the only feature, and that is a measurement rather than a guess.** The seam
# requires `AdapterInstance: Send + Sync` (`core/adapter.rs`) and 0.9.0 declares `Send`/`Sync` for
# `Runtime` and `Context` under this feature alone. A probe crate that touches every API this port
# needs — `Module::declare`/`eval`/`get("default")`, `ctx.promise()`, `Function::new`,
# `ctx.execute_pending_job()`, `Promise::state`/`result`, `Object::set`,
# `Runtime::set_memory_limit`/`set_max_stack_size`/`set_interrupt_handler`/`memory_usage` — compiles
# and runs with `features = ["parallel"]` and nothing else. The spike at
# `.workbuddy-ai/spikes/js-engine/` also enabled `bindgen`, `futures`, `loader` and `macro`; all four
# are unnecessary here. `bindgen` is the one worth naming: it exists to *regenerate* the FFI
# bindings and would put libclang in the build path, while `rquickjs-sys` ships pre-generated
# per-target bindings (`src/bindings/aarch64-apple-darwin.rs`, `x86_64-unknown-linux-gnu.rs`, …) and
# `cargo tree -f "{p} {f}"` shows it resolving with no features at all.
#
# Both `rquickjs` and `rquickjs-core` declare `default = []`, so unlike `regex` there are no default
# features to disable and `default-features = false` would be a no-op here rather than a landmine.
#
# **Cost, measured 2026-09-24:** `cargo tree --edges normal` resolves **310** with this dependency
# and **307** without it (and 166 vs 163 under `--no-default-features`) — **three new crates, and
# nothing transitive**: `rquickjs`, `rquickjs-core`, `rquickjs-sys`, which vendors QuickJS as C. A
# cold `cargo check --lib` is 26.5 s, of which `rquickjs-sys` is the bulk; a C toolchain is already
# required by `rusqlite`'s `bundled` feature, so this adds no new build prerequisite. Both
# `cargo check --lib` and `cargo check --no-default-features --all-targets` are green, so the
# Tauri-free headless build absorbs it — which is the intent: serving adapters is the headless
# service's job, so the sandbox is not optional.
#
# **And the one thing `parallel` does NOT buy, measured in the same probe:** `Runtime` and `Context`
# are `Send + Sync`, but every handle that *holds a guest value* is neither. `Persistent<T>` carries
# `rt: *mut JSRuntime` (`persistent.rs:37`), and `T` reaches `NonNull<JSContext>`
# (`context/ctx.rs:74`, through `Value`'s `Ctx`) and `*mut c_void` (`JSValue`'s `JSValueUnion`). So
# `Ctx`, `Value`, `Object`, `Function` and `Persistent<T>` are `!Send` and `!Sync` in both
# directions. This is the constraint that decides the adapter's architecture — see §2.1.3 and D30.
rquickjs = { version = "0.9", features = ["parallel"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
futures-util = "0.3.34"
thiserror = "2.0.20"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "json"] }
keyring = "2"
axum = "0.8"
async-stream = "0.3"
rand = "0.8"
arboard = "3"
url = "2.5.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# macOS only: App Nap suppression. The worker webview is hidden, and macOS suspends JS in
# hidden/backgrounded processes, which stalls the gateway. Pinned to the versions already in
# Cargo.lock (pulled in transitively by Tauri) so this resolves without a network fetch.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
