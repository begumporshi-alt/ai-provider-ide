<svg viewBox="0 0 680 660" width="680" height="660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>Gateway request pipeline — auth, context and memory</title>
<desc>A vertical flow of a request through the local gateway: auth, capacity, context and memory injection, upstream dispatch, and response finalization, with two recall paths and a gating branch.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="660" fill="#ffffff"/>

<rect x="60" y="40" width="200" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="160" y="58" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#042C53">Ingress handler</text>
<text x="160" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">chat_h / messages_h / gemini_h</text>

<rect x="440" y="40" width="200" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="58" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#042C53">1. Auth</text>
<text x="540" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">master key, then per-app keys</text>

<rect x="60" y="140" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#444441" stroke-width="0.5"/>
<text x="160" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">2. Capacity</text>
<text x="160" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">try_slot — 8 in-flight, 32 queue</text>

<rect x="40" y="230" width="600" height="210" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="252" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">3. Context + memory — inject_context (15ms budget)</text>

<polygon points="160,278 250,278 280,300 250,322 160,322" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="215" y="292" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#412402">Gate</text>
<text x="215" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">master &amp; principal</text>

<rect x="320" y="282" width="120" height="36" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="380" y="300" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#501313">Skip</text>
<text x="380" y="313" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">reason on header</text>

<rect x="320" y="330" width="160" height="60" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="400" y="348" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#04342C">Memory — scoped</text>
<text x="400" y="363" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0F6E56">recall_scoped(L1,L2,L3)</text>
<text x="400" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">excludes Unscoped rows</text>

<rect x="490" y="330" width="150" height="60" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="565" y="348" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">Live context</text>
<text x="565" y="363" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3B6D11">session_turns</text>
<text x="565" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">recent 12 turns + files</text>

<rect x="320" y="400" width="320" height="30" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="480" y="415" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">prepend system block at index 0</text>

<line x1="280" y1="300" x2="320" y2="300" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="280" y1="318" x2="320" y2="332" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="380" y1="318" x2="380" y2="330" stroke="#888780" stroke-width="1.5"/>
<line x1="480" y1="390" x2="480" y2="400" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="565" y1="390" x2="500" y2="400" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="440" y="470" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#444441" stroke-width="0.5"/>
<text x="540" y="488" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">4. Capture + Upstream</text>
<text x="540" y="504" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">prepare_capture, bridge.dispatch</text>

<rect x="60" y="470" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#444441" stroke-width="0.5"/>
<text x="160" y="488" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">Upstream provider</text>
<text x="160" y="504" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">6-header allowlist only</text>

<line x1="480" y1="430" x2="540" y2="470" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="440" y1="494" x2="260" y2="494" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="440" y="560" width="200" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="540" y="578" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">5. Response</text>
<text x="540" y="594" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">finish_capture + memory headers</text>

<line x1="160" y1="518" x2="540" y2="560" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<line x1="260" y1="64" x2="440" y2="64" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="540" y1="88" x2="540" y2="110" stroke="#888780" stroke-width="1.5"/>
<line x1="540" y1="110" x2="160" y2="110" stroke="#888780" stroke-width="1.5"/>
<line x1="160" y1="110" x2="160" y2="140" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="160" y1="188" x2="160" y2="210" stroke="#888780" stroke-width="1.5"/>
<line x1="160" y1="210" x2="100" y2="210" stroke="#888780" stroke-width="1.5"/>
<line x1="100" y1="210" x2="100" y2="230" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
