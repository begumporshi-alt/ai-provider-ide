name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-14
    steps:
      # v4 of these three target Node 20, which GitHub deprecated in 2025; they now run on Node 24
      # and emit a warning on every job. checkout v7, setup-node v7 and pnpm/action-setup v6 all
      # declare `runs.using: node24`. Both inputs relied on here were checked against the new
      # `action.yml` before bumping: setup-node still has `node-version` and `cache`, and
      # pnpm/action-setup still defaults `package_json_file` to `package.json`, which is how it
      # reads `packageManager: pnpm@10.12.4`.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # `components: clippy, rustfmt` are stated explicitly rather than assumed. Neither the clippy
      # step nor the formatting step below can run without its component, and relying on this
      # action's default set to include them would make the gate's availability depend on an
      # unstated default.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      # `--audit-level=moderate`, raised from `high` on 2026-09-22 when the vitest bump landed. The
      # two advisories that forced `high` shared a single root cause -- GHSA-82fw-gwwq-j7x9, a vitest
      # devDependency, vulnerable >=2.1.0 <4.1.11 -- and vitest is now ^4.1.11 across all three
      # manifests, so `moderate` exits 0 and the gate can hold a stricter line.
      - name: Dependency audit (moderate and above)
        run: pnpm audit --audit-level=moderate
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      # Nothing else in this workflow compiles the production bundle: the Playwright step below
      # runs against a vite DEV server (playwright.config.ts), so a bundle that no longer builds
      # stayed green here. scripts/ci-local.sh has always had this step; ci.yml did not, which made
      # the local mirror stricter than CI.
      - name: Build (the bundle must compile)
        run: pnpm build
      - name: Key-leak grep (criterion 5)
        run: pnpm key-leak-grep
      - name: Single TypeScript version (audit R6)
        run: pnpm check-ts-version
      - name: One product version across every manifest
        run: pnpm check-version-sync
      # Every relative link and image in every markdown file must resolve. Added because a
      # documentation reorganisation on 2026-09-22 verified only `.md` targets and silently broke
      # every `.html`, `.svg` and bare-directory link -- including two image embeds that rendered
      # as broken images. The same class of bug recurred within the hour. See drift register D9.
      - name: Doc links resolve
        run: pnpm check-doc-links
      # Formatting first: cheapest check in this block, and a no-op whenever the tree is
      # already formatted. `--check` never writes a file. The config it reads is
      # apps/desktop/src-tauri/rustfmt.toml -- see that file for why
      # `use_small_heuristics = "Max"` is the one non-default setting, and for the measured
      # reason it is 354 hunks instead of the 638 a stock config would produce.
      - name: Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Rust check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      # `--all-targets` on purpose: the test code is where a lint earns its keep. Two of the
      # warnings this step was introduced to clear were dead branches with identical arms
      # (`clippy::if_same_then_else`) -- one in crash reporting, one in the Gemini dialect adapter.
      # Neither was a compile error, neither failed a test, and the Gemini one sat on a code path
      # no test reached at all. Linting only the lib would have missed half the class.
      #
      # `-D warnings`, not a warning count: a gate that tolerates warnings stops being read the
      # moment there are 25 of them. Reaching zero was mostly `cargo clippy --fix`; the two
      # remaining judgement calls (a test helper with 8 positional args, three counts from three
      # statements) carry a local `#[allow]` with its reason written down.
      - name: Rust clippy (lints must be clean)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests (gateway criterion 8, egress invariants, store, persist)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Install Playwright browsers
        run: pnpm --filter ai-provider-router-desktop exec playwright install chromium
      - name: Live-UI tests (Playwright harness — wizard, Tier-2 review, egress image)
        run: pnpm --filter ai-provider-router-desktop web-test
