<!doctype html>
<!--
  Gateway worker page (audit R1).

  Loaded by a dedicated, never-visible WebviewWindow so the gateway's request path runs in a
  renderer of its own. Two consequences this removes:

  - the visible UI's React work can no longer delay a gateway request;
  - an HMR reload of the UI no longer tears down the bridge (this page's module graph does not
    include the React tree, so editing screens does not reload it).

  This is not "headless" in the strict sense — it is still a webview, and the router core is
  still TypeScript — but it decouples the gateway from the UI renderer without shipping a Node
  runtime or re-plumbing the host command surface. See ARCHITECTURE_AUDIT.md R1.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI-Provider Router — gateway worker</title>
    <style>
      body { font: 12px ui-monospace, monospace; margin: 12px; }
      .ok { color: #16a34a; }
      .err { color: #dc2626; }
    </style>
  </head>
  <body>
    <pre id="log">starting gateway worker…</pre>
    <script type="module" src="/src/gateway-worker.ts"></script>
  </body>
</html>
