name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      # `--audit-level=high`, not `moderate`. Measured at f5c17c1: `moderate` fails on 2 advisories
      # whose single root cause is a vitest devDependency, and the patched line is >=4.1.11 against a
      # latest of 5.0.1 -- so `moderate` cannot be satisfied without a major test-runner migration.
      # A gate that fails on the first push is worse than no gate. `high` exits 0 today and still
      # catches the class that matters. Raise it when the vitest bump lands.
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level=high
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      # Nothing else in this workflow compiles the production bundle: the Playwright step below
      # runs against a vite DEV server (playwright.config.ts), so a bundle that no longer builds
      # stayed green here. scripts/ci-local.sh has always had this step; ci.yml did not, which made
      # the local mirror stricter than CI.
      - name: Build (the bundle must compile)
        run: pnpm build
      - name: Key-leak grep (criterion 5)
        run: pnpm key-leak-grep
      - name: Single TypeScript version (audit R6)
        run: pnpm check-ts-version
      - name: One product version across every manifest
        run: pnpm check-version-sync
      - name: Rust check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Rust tests (gateway criterion 8, egress invariants, store, persist)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Install Playwright browsers
        run: pnpm --filter ai-provider-router-desktop exec playwright install chromium
      - name: Live-UI tests (Playwright harness — wizard, Tier-2 review, egress image)
        run: pnpm --filter ai-provider-router-desktop web-test
