<svg viewBox="0 0 680 452" width="680" height="452" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>Attempt loop — key rotation and provider failover</title>
<desc>Inside stage 4 of the gateway read path. A candidate is attempted through the adapter and egress gateway. The error is classified: a 200 streams chunks to the client, while a 401 or 429 cools the key, opens the breaker if all keys fail, and advances to the next candidate. When the plan is exhausted the client gets an error.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="150" y="40" width="260" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="280" y="62" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#042C53">plan = ordered candidates</text>

<line x1="280" y1="84" x2="280" y2="116" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="120" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="280" y="141" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#042C53">attempt — adapter to provider</text>
<text x="280" y="157" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">credential injected in Rust</text>

<line x1="280" y1="172" x2="280" y2="204" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="208" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#444441" stroke-width="0.5"/>
<text x="280" y="230" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">classify the error</text>

<line x1="280" y1="252" x2="280" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="296" width="260" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="280" y="317" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">cool the key, open the breaker</text>
<text x="280" y="333" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">advance to the next candidate</text>

<line x1="280" y1="348" x2="280" y2="384" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="388" width="260" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="280" y="410" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F">plan exhausted — error to client</text>

<polyline points="410,230 545,230 545,292" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3B6D11">200</text>

<rect x="450" y="296" width="190" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="545" y="317" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">stream to the client</text>
<text x="545" y="333" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">SSE chunks, ledger written</text>

<polyline points="150,322 96,322 96,146 146,146" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="94" y="240" text-anchor="end" dominant-baseline="central" font-size="12" fill="#854F0B">401 / 429</text>
</svg>
