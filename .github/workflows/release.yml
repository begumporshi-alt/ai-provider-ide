name: Release

# Tags only. ci.yml already runs on every push to main, so triggering a release build on every push
# would double the work and produce unsigned artefacts nobody asked for.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # First, and before the toolchain download, because it costs about a second and catches
      # the one mistake that otherwise survives the whole build: half-configured Apple
      # credentials. Two valid states:
      #   - No secrets → the build is ad-hoc signed. Fine for self-distribution on your
      #     own machine; not a publicly distributable artefact (macOS Gatekeeper will
      #     block a download you did not produce).
      #   - All secrets present → full Developer ID signing + notarization, producing a
      #     draft release other Macs can launch.
      # A half-configured state (some secrets, others missing) is a defect: the build
      # signs with what is available and fails at notarization, leaving a green job and a
      # broken draft. This guard catches it fast.
      - name: Release preflight
        id: preflight
        run: bash scripts/release-preflight.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Both targets, because the artefact is built universal — one download that runs on Apple
      # Silicon and Intel alike.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # The same gate CI runs, before anything is built. A release is the worst possible place to
      # discover that a check was skipped. Browser specs are omitted because this job's purpose is
      # to produce an artefact, not to re-run the UI suite that `main` already passed.
      - name: Gate
        run: bash scripts/ci-local.sh --skip-browser

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarization come entirely from the environment, and are deliberately
          # NOT configured in tauri.conf.json: no job in this repository runs a full `tauri build`
          # outside this workflow, so a signing identity pinned in the config would be invisible
          # to every other check. `release-preflight.sh` enforces that mechanically.
          #
          # Two modes (see release-preflight.sh):
          #   No secrets  → ad-hoc signed. Works on the builder's machine; macOS Gatekeeper
          #                 blocks it on other Macs. Fine for development and self-distribution.
          #   All secrets → Developer ID + notarization. A draft release other Macs can launch.
          #
          # Secrets (see CONTRIBUTING.md, "Releasing"):
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD  — the Developer ID .p12, base64
          #   APPLE_SIGNING_IDENTITY                         — optional; derived from the cert
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID        — notarization credentials
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: "AI-Provider Router ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what changed in this release."
          # A draft, so the artefacts can be checked before anyone can download them.
          releaseDraft: true
          prerelease: false

      # The distributed service binary must not link WebKit. `tauri build` always overwrites the
      # bundled `aiproviderd` with the default-features (Tauri/WebKit) one, so the post-bundle
      # substitution is a step, not a property of the build: without it, the 26s gate (the
      # `check-bundled-aiproviderd-links.sh` otool check) would redden and the release would be a
      # WebKit-linked service binary, which is the exact thing the no-WebKit build exists to avoid.
      - name: Substitute the Tauri-free aiproviderd into the bundle
        run: bash scripts/substitute-tauri-free-aiproviderd.sh

      - name: Verify bundled aiproviderd links no WebKit
        run: bash scripts/check-bundled-aiproviderd-links.sh

      # Read the artefacts back and prove what they are, instead of trusting that the environment
      # variables above were enough. `codesign --verify` alone would NOT catch this: an ad-hoc
      # signature is a *valid* signature and passes it. The checks that separate the two states are
      # `spctl`, `stapler validate`, the CodeDirectory flags word and the Authority chain — all
      # measured against both states before this step was written.
      #
      # Only meaningful when the full credential set is present (a notarized build was attempted).
      # An ad-hoc build (no secrets) has no stapled ticket to verify; the WebKit-link check above
      # is the meaningful gate for that state.
      - name: Verify artifacts are signed and notarized
        if: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: bash scripts/verify-release-signature.sh
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The draft is withdrawn if a step in the *verified* pipeline failed, so a bad artefact
      # cannot be published by someone who only sees that the release exists. A draft that
      # outlives a red job is the exact "worse than no build" case this workflow is written to
      # avoid. In the no-secrets (ad-hoc) path nothing after the WebKit check can fail, so this
      # step is a no-op there.
      - name: Withdraw the draft release
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Verification failed — deleting the draft release for ${{ github.ref_name }}."
            gh release delete "${{ github.ref_name }}" --yes
          else
            echo "No release exists for ${{ github.ref_name }}; nothing to withdraw."
          fi
