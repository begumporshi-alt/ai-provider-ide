<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Provider Router — Self-Construction Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.75rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">AI-Provider Router · Self-Construction</p>
    <h1>Adding any new provider</h1>
    <p class="sub">From a name, a base URL and one API key to a live provider — no code, no app update. Secrets never reach the AI.</p>

    <svg viewBox="0 0 896 952" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aip-selfconstruct-title aip-selfconstruct-desc">
      <title id="aip-selfconstruct-title">Self-construction pipeline for onboarding any new provider</title>
      <desc id="aip-selfconstruct-desc">Flowchart of auto-onboarding: user input leads to an API probe and a dialect check; known dialects instantiate a builtin template instantly with no AI, unknown dialects get an adapter manifest drafted by the system AI from redacted probe input, contract tests validate the result with the user's key, failures loop back to regenerate, and human confirmation makes the provider live.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ══ Arrows (before nodes) ══ -->

      <line x1="360" y1="100" x2="360" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="360" y1="196" x2="360" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Known dialect? YES → template -->
      <path d="M 440,276 H 752 Q 760,276 760,284 V 372"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="580" y="256" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="265" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- Known dialect? NO → System AI -->
      <line x1="360" y1="316" x2="360" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="368" y="332" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Template → contract tests -->
      <path d="M 760,436 V 504 Q 760,512 752,512 H 448"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- System AI → contract tests -->
      <line x1="360" y1="436" x2="360" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="360" y1="544" x2="360" y2="588" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- All pass? PASS → review -->
      <line x1="360" y1="668" x2="360" y2="716" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="368" y="684" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="386" y="693" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>

      <!-- All pass? FAIL → regenerate (retry loop, dashed) -->
      <path d="M 272,628 H 128 Q 120,628 120,620 V 408 Q 120,400 128,400 H 268"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="128" y="496" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="164" y="505" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGENERATE</text>

      <line x1="360" y1="780" x2="360" y2="820" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ══ Nodes ══ -->

      <!-- Start (user input) -->
      <rect x="280" y="44" width="160" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="280" y="44" width="160" height="56" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="360" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User adds provider</text>
      <text x="360" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">name · URL · API key</text>

      <!-- Probe -->
      <rect x="272" y="140" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="272" y="140" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Probe the API</text>
      <text x="360" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">endpoints · auth shapes</text>

      <!-- Decision: known dialect? -->
      <polygon points="360,236 440,276 360,316 280,276" fill="#f5f5f5"/>
      <polygon points="360,236 440,276 360,316 280,276" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Known dialect?</text>
      <text x="360" y="290" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">compat · OpenAPI</text>

      <!-- Instantiate template (deterministic path) -->
      <rect x="672" y="372" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="372" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Instantiate template</text>
      <text x="760" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zero AI · instant</text>

      <!-- System AI drafts manifest (focal) -->
      <rect x="268" y="364" width="184" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="268" y="364" width="184" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="360" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">System AI drafts manifest</text>
      <text x="360" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">redacted input · best-of-3</text>

      <!-- Contract tests -->
      <rect x="272" y="480" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="272" y="480" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contract tests</text>
      <text x="360" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ping · list models · tiny gen</text>

      <!-- Decision: all pass? -->
      <polygon points="360,588 448,628 360,668 272,628" fill="#f5f5f5"/>
      <polygon points="360,588 448,628 360,668 272,628" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="626" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">All pass?</text>
      <text x="360" y="642" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">using your key</text>

      <!-- Review & enable -->
      <rect x="268" y="716" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="268" y="716" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="742" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review &amp; enable</text>
      <text x="360" y="760" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">human confirmation</text>

      <!-- End: provider live -->
      <rect x="272" y="820" width="176" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="272" y="820" width="176" height="56" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="360" y="844" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider live</text>
      <text x="360" y="862" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manifest v1 registered</text>

      <!-- Editorial aside -->
      <text x="572" y="584" fill="#7a8399" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Known dialects skip the AI entirely —</text>
      <text x="572" y="604" fill="#7a8399" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">templates bootstrap the first provider.</text>

      <!-- ══ Legend ══ -->
      <line x1="30" y1="904" x2="866" y2="904" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="928" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="96" y="918" width="28" height="14" rx="7" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="132" y="929" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">START / END</text>

      <rect x="228" y="918" width="20" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="256" y="929" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">STEP</text>

      <polygon points="338,916 358,925 338,934 318,925" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="366" y="929" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">DECISION</text>

      <rect x="452" y="918" width="20" height="14" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="929" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">AI-GENERATED</text>

      <line x1="592" y1="925" x2="628" y2="925" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="636" y="929" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">RETRY LOOP</text>
    </svg>
  </div>
</body>
</html>
