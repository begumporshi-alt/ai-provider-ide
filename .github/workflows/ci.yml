name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-14
    steps:
      # v4 of these three target Node 20, which GitHub deprecated in 2025; they now run on Node 24
      # and emit a warning on every job. checkout v7, setup-node v7 and pnpm/action-setup v6 all
      # declare `runs.using: node24`. Both inputs relied on here were checked against the new
      # `action.yml` before bumping: setup-node still has `node-version` and `cache`, and
      # pnpm/action-setup still defaults `package_json_file` to `package.json`, which is how it
      # reads `packageManager: pnpm@10.12.4`.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # `components: clippy, rustfmt` are stated explicitly rather than assumed. Neither the clippy
      # step nor the formatting step below can run without its component, and relying on this
      # action's default set to include them would make the gate's availability depend on an
      # unstated default.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      # `--audit-level=moderate`, raised from `high` on 2026-09-22 when the vitest bump landed. The
      # two advisories that forced `high` shared a single root cause -- GHSA-82fw-gwwq-j7x9, a vitest
      # devDependency, vulnerable >=2.1.0 <4.1.11 -- and vitest is now ^4.1.11 across all three
      # manifests, so `moderate` exits 0 and the gate can hold a stricter line.
      - name: Dependency audit (moderate and above)
        run: pnpm audit --audit-level=moderate
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      # Nothing else in this workflow compiles the production bundle: the Playwright step below
      # runs against a vite DEV server (playwright.config.ts), so a bundle that no longer builds
      # stayed green here. scripts/ci-local.sh has always had this step; ci.yml did not, which made
      # the local mirror stricter than CI.
      - name: Build (the bundle must compile)
        run: pnpm build
      - name: Key-leak grep (criterion 5)
        run: pnpm key-leak-grep
      - name: Single TypeScript version (audit R6)
        run: pnpm check-ts-version
      - name: One product version across every manifest
        run: pnpm check-version-sync
      # Every relative link and image in every markdown file must resolve. Added because a
      # documentation reorganisation on 2026-09-22 verified only `.md` targets and silently broke
      # every `.html`, `.svg` and bare-directory link -- including two image embeds that rendered
      # as broken images. The same class of bug recurred within the hour. See drift register D9.
      - name: Doc links resolve
        run: pnpm check-doc-links
      # Stated, not assumed. These steps run against whatever `stable` is, and the lint set moves
      # with it -- so when clippy goes red, the log should say which toolchain produced it rather
      # than leave it to be inferred from the lint names. The local mirror already prints
      # `node -v` for the same reason; this is the Rust half of that.
      - name: Rust toolchain
        run: rustc --version
      # Formatting first: cheapest check in this block, and a no-op whenever the tree is
      # already formatted. `--check` never writes a file. The config it reads is
      # apps/desktop/src-tauri/rustfmt.toml -- see that file for why
      # `use_small_heuristics = "Max"` is the one non-default setting, and for the measured
      # reason it is 354 hunks instead of the 638 a stock config would produce.
      - name: Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Rust check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      # `--all-targets` on purpose: the test code is where a lint earns its keep. Two of the
      # warnings this step was introduced to clear were dead branches with identical arms
      # (`clippy::if_same_then_else`) -- one in crash reporting, one in the Gemini dialect adapter.
      # Neither was a compile error, neither failed a test, and the Gemini one sat on a code path
      # no test reached at all. Linting only the lib would have missed half the class.
      #
      # `-D warnings`, not a warning count: a gate that tolerates warnings stops being read the
      # moment there are 25 of them. Reaching zero was mostly `cargo clippy --fix`; what is left
      # carries a local `#[allow]` with its reason written down -- a test helper with 8 positional
      # args (`memory.rs`), and `result_large_err` on `try_slot`, where boxing the error would add a
      # heap allocation to every refusal and buy nothing. (The `type_complexity` allow this comment
      # used to name is gone: both sites now return a named type and cite the lint in a comment.)
      #
      # This step runs against whatever `stable` is, so a Rust release can turn it red with no code
      # change at all. 1.88 was clean here; 1.98 found four more lints -- a dead struct,
      # `manual_is_multiple_of`, `sort_by_key`, `result_large_err`. Keep the local toolchain current
      # (`rustup update stable`), or pin one so this step moves only when you move it.
      - name: Rust clippy (lints must be clean)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests (gateway criterion 8, egress invariants, store, persist)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Install Playwright browsers
        run: pnpm --filter ai-provider-router-desktop exec playwright install chromium
      - name: Live-UI tests (Playwright harness — wizard, Tier-2 review, egress image)
        run: pnpm --filter ai-provider-router-desktop web-test

  # Headless service binary (`aiproviderd`) — dev-book §10, Phase 1.
  #
  # This is a NEW job rather than an entry in an existing matrix: `checks` is a single macOS job
  # with no strategy block at all, so there is nothing to extend. The point of building on all
  # three is that the service has never been compiled anywhere but this Mac; a module split that
  # accidentally reached back into Tauri glue would surface here, not in `checks`.
  headless-service:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # `tauri` is still an unconditional dependency of this package and `build.rs` still runs
      # `tauri_build::build()` for every target, so building the service still compiles Tauri --
      # and on Linux that means WebKitGTK. These packages are the cost of that coupling, not of
      # the service; a separate `core` crate or a `tauri` feature would remove this step.
      - name: Linux system deps (WebKitGTK, via the tauri dependency)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf
      - name: Build headless service binary
        run: cargo build --bin aiproviderd --release
        working-directory: apps/desktop/src-tauri
      # `--version` is the whole of the runtime assertion here, deliberately. It needs no port,
      # no keychain approval and no store, so it cannot flake -- and it still proves the binary
      # links and starts. The `/health` proof is a manual step (dev-book §10 records it): binding
      # a port and reading the OS keychain on a shared runner is exactly the kind of step that
      # fails for reasons unrelated to the change under test.
      #
      # `working-directory` is load-bearing, and its absence is the reason the first run of this
      # job failed on all three platforms at this step with
      # `target/release/aiproviderd: No such file or directory`. The build step above sets it, so
      # `target/` means `apps/desktop/src-tauri/target`; here the same relative path resolved
      # against the repo root instead. `--version` itself was never the problem -- the step could
      # not find the file. The rule: a step that only *asserts* what a previous step produced must
      # resolve paths the way that step did, and an explicit `test -f` with a named error beats a
      # silent `command not found`.
      - name: Service binary runs
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          bin=target/release/aiproviderd
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          test -f "$bin" || { echo "::error::service binary not found at $bin"; exit 1; }
          "$bin" --version
