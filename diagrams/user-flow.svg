<svg viewBox="0 0 680 364" width="680" height="364" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>User flow — first run, then the daily loop</title>
<desc>Four one-time steps to get running: add a provider, add a key, enable and verify, browse models. Then a repeating loop: use it from the Assistant or any external client, observe via Activity and the ledger, and tune via Control, Memory, Skills and Agents.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="60" y="44" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">First run — once</text>
<text x="370" y="44" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">Daily loop — repeats</text>

<rect x="60" y="64" width="250" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#042C53">1 · Add a provider</text>
<text x="185" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">quick, manual, or guided</text>

<line x1="185" y1="112" x2="185" y2="128" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="132" width="250" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="150" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#042C53">2 · Add a key</text>
<text x="185" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">written to the OS keychain</text>

<line x1="185" y1="180" x2="185" y2="196" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="200" width="250" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="218" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#042C53">3 · Enable and verify</text>
<text x="185" y="234" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">contract tests, then approve</text>

<line x1="185" y1="248" x2="185" y2="264" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="268" width="250" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="286" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#042C53">4 · Browse models</text>
<text x="185" y="302" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Text and Image tabs</text>

<line x1="312" y1="88" x2="366" y2="88" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="370" y="64" width="250" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="495" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#04342C">5 · Use it</text>
<text x="495" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Assistant, Cursor, Codex, scripts</text>

<line x1="495" y1="112" x2="495" y2="128" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="370" y="132" width="250" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="495" y="150" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#04342C">6 · Observe</text>
<text x="495" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Activity, ledger, drift events</text>

<line x1="495" y1="180" x2="495" y2="196" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="370" y="200" width="250" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="495" y="218" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#04342C">7 · Tune</text>
<text x="495" y="234" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Control, Memory, Skills, Agents</text>

<line x1="60" y1="328" x2="620" y2="328" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="60" y="346" dominant-baseline="central" font-size="12" fill="#5F5E5A">System AI unlocks after step 3: the AI-assisted onboarding path needs one live provider.</text>
</svg>
