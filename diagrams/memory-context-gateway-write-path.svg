<svg viewBox="0 0 680 700" width="680" height="700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>Memory write path — capture, queue, distillation, layers</title>
<desc>A flow showing a finished exchange entering memory_pending, the webview drain tick claiming and distilling it into L1 atoms, and the layered lifecycle up to L3 with supersede.</desc>
<defs>
<marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="700" fill="#ffffff"/>

<text x="40" y="30" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">Write side — off the request path</text>

<rect x="40" y="52" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="70" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#042C53">BridgeMsg::Done</text>
<text x="130" y="87" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">finish_capture, host side</text>

<rect x="40" y="140" width="180" height="76" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="130" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#412402">enqueue — 4 gates</text>
<text x="130" y="175" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">internal? writes off?</text>
<text x="130" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">tools? &lt;MIN_PROSE?</text>
<text x="130" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">dup request_id?</text>

<rect x="40" y="256" width="180" height="60" rx="8" fill="#F1EFE8" stroke="#444441" stroke-width="0.5"/>
<text x="130" y="276" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">memory_pending</text>
<text x="130" y="292" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5F5E5A">status='queued'</text>
<text x="130" y="306" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">id UNIQUE for DB life</text>

<rect x="270" y="140" width="370" height="290" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="290" y="162" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">Webview drain — drain.ts</text>
<text x="290" y="180" dominant-baseline="central" font-size="12" fill="#534AB7">every 60s, off the request path</text>

<rect x="290" y="198" width="160" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="370" y="213" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">requeue_stale</text>
<text x="370" y="229" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">crash recovery, 10m TTL</text>

<rect x="470" y="198" width="150" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="545" y="213" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">claim()</text>
<text x="545" y="229" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">budget-capped batch</text>

<rect x="290" y="258" width="330" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="455" y="273" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#04342C">distilExchange — one model call per row</text>
<text x="455" y="289" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">status → 'processing', attempts + 1</text>

<rect x="290" y="318" width="160" height="44" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="370" y="333" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">complete()</text>
<text x="370" y="349" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">atoms stored → done</text>

<rect x="470" y="318" width="150" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="545" y="333" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#501313">release()</text>
<text x="545" y="349" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">3 tries → failed</text>

<text x="455" y="392" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">never auto-scoped — atoms written capture-only</text>
<text x="455" y="410" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">binding is a deliberate act in the Memory screen</text>

<rect x="40" y="462" width="580" height="200" rx="14" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="484" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">memories — layered lifecycle</text>

<rect x="60" y="502" width="120" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="120" y="520" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#4A1B0C">L0 raw</text>
<text x="120" y="536" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">verbatim turns</text>

<rect x="200" y="502" width="120" height="56" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
<text x="260" y="520" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#4B1528">L1 atoms</text>
<text x="260" y="536" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993556">distilled facts</text>

<rect x="340" y="502" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="400" y="520" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#04342C">L2 scenario</text>
<text x="400" y="536" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">condensed blocks</text>

<rect x="480" y="502" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="520" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#042C53">L3 core</text>
<text x="540" y="536" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">stable profile</text>

<line x1="180" y1="530" x2="200" y2="530" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<line x1="320" y1="530" x2="340" y2="530" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<line x1="460" y1="530" x2="480" y2="530" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>

<text x="60" y="588" dominant-baseline="central" font-size="12" fill="#3B6D11">recall reads L1/L2/L3 — L0 excluded (another vendor's session)</text>
<text x="60" y="606" dominant-baseline="central" font-size="12" fill="#3B6D11">supersede sets superseded_at — refused on pinned or L3 rows</text>
<text x="60" y="624" dominant-baseline="central" font-size="12" fill="#3B6D11">recall filters superseded_at IS NULL; the Memory screen still lists them</text>
<text x="60" y="642" dominant-baseline="central" font-size="12" fill="#3B6D11">done/failed rows purged after 7 days</text>

<line x1="130" y1="104" x2="130" y2="140" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<line x1="130" y1="216" x2="130" y2="256" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<line x1="220" y1="286" x2="270" y2="286" stroke="#888780" stroke-width="1.5"/>
<line x1="270" y1="286" x2="270" y2="220" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<line x1="450" y1="220" x2="470" y2="220" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<line x1="545" y1="242" x2="545" y2="258" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<line x1="455" y1="302" x2="400" y2="318" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<line x1="470" y1="302" x2="520" y2="318" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<line x1="400" y1="362" x2="330" y2="462" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
</svg>
