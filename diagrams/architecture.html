      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;

      font-size: 0.9rem;

    }
    svg { width: 100%; min-width: 900px; display: block; }

<body>
  <div class="frame">
    <p class="eyebrow">AI-Provider IDE · System Architecture</p>
    <h1>One router in front of every provider</h1>
    <p class="sub">The IDE — and any external app via the Local Gateway — never talks to providers directly. Keys live only in the Rust host; the webview is key-blind by construction.</p>

    <svg viewBox="0 0 1120 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aip-system-title aip-system-desc">
      <title id="aip-system-title">AI-Provider IDE system architecture</title>
      <desc id="aip-system-desc">Layered architecture: the React UI calls the Model Router, which plans attempts across the Adapter Runtime; all outbound HTTPS flows through the Rust egress gateway, which alone reads API keys from the OS keychain vault and forwards requests to third-party providers. External apps reach the same Model Router through a Local Gateway at 127.0.0.1:8787 authenticated by a generated master key, and an Adapter Generator self-constructs new provider integrations using AI routed back through the Model Router.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="110" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WEBVIEW · TYPESCRIPT</text>

      <rect x="24" y="312" width="1072" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="316" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="92" y="325" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RUST HOST · L0</text>

      <rect x="24" y="480" width="1072" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
